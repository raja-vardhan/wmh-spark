# Local development config -- runs on a laptop using local[*] master.
# Useful for unit tests, debugging, and the single-node baseline benchmark.
seed: 42

spark:
  app_name: wmh-spark-local
  master: "local[4]"
  driver_memory: "8g"
  executor_memory: "4g"
  executor_cores: 2
  num_executors: 1
  arrow_max_records_per_batch: 1000

stripping:
  method: synthstrip   # CPU fallback; replace with hdbet on GPU nodes
  container_path: null # set to /path/to/synthstrip.sif on CHPC
  gpu: false

registration:
  template_path: data/templates/MNI152_T1_1mm_brain.nii.gz
  transform_type: Affine
  cache_warps: true

features:
  use_flair_zscore: true
  use_t1_intensity: true
  use_flair_t1_ratio: true
  use_distance_to_ventricle: true
  use_mni_coords: true
  use_neighborhood_stats: true
  neighborhood_radius: 1
  wm_mask_threshold: 0.5
  flair_min_threshold: 0.7

sampling:
  negative_to_positive_ratio: 5
  max_voxels_per_subject: 100000
  train_fraction: 0.7
  val_fraction: 0.15
  test_fraction: 0.15

model:
  name: rf
  knn_k: 5
  rf_num_trees: 100
  rf_max_depth: 12
  rf_min_instances_per_node: 50
  rf_subsampling_rate: 0.7
  xgb_max_depth: 8
  xgb_learning_rate: 0.1
  xgb_n_estimators: 200

evaluation:
  primary_reference: expert
  decision_threshold: 0.5
  compute_dice: true
  compute_lesion_f1: true
  compute_hausdorff: true
  compute_volume_difference: true
  lesion_overlap_threshold: 0.0

paths:
  data_dir: data
  manifest_path: data/manifest.parquet
  work_dir: data/work
  output_dir: data/output
  model_dir: data/output/models
  metrics_dir: data/output/metrics
  log_dir: data/logs
