[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wmh-spark"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyspark==3.5.1",
    "numpy==1.26.4",
    "nibabel==5.2.1",
    "pyarrow==14.0.2",
    "pandas==2.2.1",
    "pyyaml==6.0.1",
    "tqdm==4.66.2",
]

[tool.setuptools.packages.find]
where = ["src"]
